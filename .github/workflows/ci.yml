name: Test and build Screen

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_platform: offscreen
          - os: windows-latest
            qt_platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - name: Application smoke test
        run: python -m screen_overlay --smoke-test --smoke-report smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-report.json
          if-no-files-found: ignore

  build:
    name: Portable Windows app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and run packaged exe
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-windows-x64
          path: |
            dist/Screen-windows-x64.zip
            dist/Screen-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish tested preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Screen-windows-x64
          path: dist
      - name: Create versioned preview if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" dist/Screen-windows-x64.zip dist/Screen-windows-x64.zip.sha256 \
              --target "$GITHUB_SHA" --prerelease --title "Screen $version preview" \
              --notes-file docs/release-notes.md
          fi
